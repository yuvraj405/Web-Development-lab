<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <div id="container">
        <h1>Student Expense Tracker</h1>
         
        <div class="input-section">
        <input type="text" id="name" placeholder="Name of the product"/>
         
        <input type="number" id="amount" placeholder="price"/>

        <select id="category">
            <option value="food">Food</option>
            <option value="travel">Travel</option>
            <option value="shopping">Shopping</option>
            <option value="education">Education</option>
            <option value="others">Others</option>
        </select>

        <button id="addBtn">add to total</button>

        <div class="final">
        <input type="number" id="total" placeholder="Total spenditure">
        <input type="text" id="items" placeholder="items bought">
      </div>

      </div>
    </div>
<script src="script.js"></script>
</body>
</html>
